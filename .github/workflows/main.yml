name: Build AI Studio Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        unzip -q *.zip -d AppSource
        # Find where settings.gradle.kts is located
        PROJECT_DIR=$(dirname $(find AppSource -name "settings.gradle.kts" | head -n 1))
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Prepare Keystore and Build Files
      run: |
        cd "$PROJECT_DIR"
        # Generate missing debug.keystore required by AI Studio config
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        # Create empty .env to prevent build errors
        touch .env

    - name: Build Debug APK
      run: |
        cd "$PROJECT_DIR"
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RoutineFlow-APK
        path: AppSource/**/build/outputs/apk/debug/*.apk
